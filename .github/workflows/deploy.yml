name: Deploy ML service to production

# main -> production (Hetzner). The service is internal-only — no public port,
# no DNS record — so the health gate runs on the server, inside ci-deploy.sh,
# against the container's own healthcheck.
#
# ORDERING: when a change spans BOTH services (e.g. the inline-base64 scan
# contract), deploy spy-ml FIRST, let it go green, then deploy spy-be. The
# backend tolerates an ML service that is ahead of it; the reverse is not true.
#
# Like the backend workflow, this copies nothing and runs no commands on the
# server. The SSH key is pinned by a forced `command=` to ~/faciey/ci-deploy.sh,
# so the only thing this workflow can express is "redeploy spy-ml". The server
# pulls origin/main itself.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ml-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # a cold image build re-downloads the InsightFace model
    steps:
      - name: Check required secrets
        run: |
          # Without this, a missing secret interpolates to an empty string and
          # surfaces twenty lines later as "Could not resolve hostname :" —
          # which reads like a DNS fault rather than an unset variable.
          # GitHub secrets are PER-REPOSITORY; adding them to the other repo
          # does not carry over.
          missing=""
          [ -n "${{ secrets.SSH_HOST }}" ]        || missing="$missing SSH_HOST"
          [ -n "${{ secrets.SSH_KEY }}" ]         || missing="$missing SSH_KEY"
          [ -n "${{ secrets.SSH_KNOWN_HOSTS }}" ] || missing="$missing SSH_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them at Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "required secrets present"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned from a secret rather than ssh-keyscan at runtime, which would
          # trust whatever host happens to answer.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              deploy@"${{ secrets.SSH_HOST }}" spy-ml
